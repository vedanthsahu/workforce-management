<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>{% block title %}SeatBook{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef1f1;-webkit-text-size-adjust:100%;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{% block preheader %}{% endblock %}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef1f1;">
        <tr>
            <td align="center" style="padding:32px 16px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid #e0e4e4;border-radius:8px;">
                    <tr>
                        <td height="4" bgcolor="#24616b" style="height:4px;background-color:#24616b;font-size:0;line-height:0;border-radius:8px 8px 0 0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td style="padding:24px 36px 0 36px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <span style="font-size:16px;font-weight:700;letter-spacing:2px;color:#24616b;text-transform:uppercase;">SeatBook</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:22px 36px 10px 36px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1c2226;">
{% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:18px 36px 26px 36px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#7a8287;border-top:1px solid #eef0f0;">
                            This is an automated notification from SeatBook. Please do not reply to this email.
                        </td>
                    </tr>
                </table>
                <div style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;color:#9aa1a5;padding-top:14px;">
                    SeatBook &middot; Workplace seat management
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
