<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Seat Booking Cancelled</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
    <h2 style="margin-bottom: 16px;">Booking cancelled</h2>

    <p>Hello {{ user_name }},</p>

    <p>Your seat booking has been cancelled.</p>

    <table cellpadding="6" cellspacing="0" style="border-collapse: collapse;">
        <tr>
            <td><strong>Seat</strong></td>
            <td>{{ seat_name }}</td>
        </tr>
        <tr>
            <td><strong>Date</strong></td>
            <td>{{ booking_date }}</td>
        </tr>
        <tr>
            <td><strong>Location</strong></td>
            <td>{{ location }}</td>
        </tr>
        <tr>
            <td><strong>Reason</strong></td>
            <td>{{ cancellation_reason }}</td>
        </tr>
    </table>

    <p>Thank you,<br />Seat Management Team</p>
</body>
</html>
