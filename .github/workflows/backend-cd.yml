name: Backend CD (Deploy)

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - "dev"
      - "uat"

# Ensure permissions are configured for AWS OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev' }}
    environment: dev
    concurrency:
      group: backend-dev-deployment
      cancel-in-progress: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Configure AWS credentials from OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Setup AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    - name: Validate Secrets
      run: |
        if [ -z "${{ secrets.DATABASE_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.APPLICATION_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.DB_NAME }}" ] || \
           [ -z "${{ secrets.MICROSOFT_CLIENT_ID }}" ] || \
           [ -z "${{ secrets.MICROSOFT_TENANT_ID }}" ] || \
           [ -z "${{ secrets.REDIRECT_URI }}" ] || \
           [ -z "${{ secrets.FRONTEND_URL }}" ] || \
           [ -z "${{ secrets.S3_BUCKET_NAME }}" ] || \
           [ -z "${{ secrets.S3_PUBLIC_BASE_URL }}" ] || \
           [ -z "${{ secrets.SES_SENDER_EMAIL }}" ] || \
           [ -z "${{ secrets.PRIVATE_SUBNET_IDS }}" ] || \
           [ -z "${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}" ]; then
          echo "Error: One or more required secrets are missing. Deployment aborted."
          exit 1
        fi

    - name: SAM Build
      run: sam build --use-container

    - name: SAM Deploy
      run: >
        sam deploy 
        --stack-name workforce-api-dev 
        --resolve-s3 
        --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND 
        --no-confirm-changeset 
        --no-fail-on-empty-changeset 
        --parameter-overrides 
        EnvironmentName=dev 
        DatabaseSecretArn=${{ secrets.DATABASE_SECRET_ARN }} 
        ApplicationSecretArn=${{ secrets.APPLICATION_SECRET_ARN }} 
        DbName=${{ secrets.DB_NAME }} 
        MicrosoftClientId=${{ secrets.MICROSOFT_CLIENT_ID }} 
        MicrosoftTenantId=${{ secrets.MICROSOFT_TENANT_ID }} 
        RedirectUri=${{ secrets.REDIRECT_URI }}
        FrontendUrl=${{ secrets.FRONTEND_URL }}
        AdditionalFrontendUrls="${{ secrets.ADDITIONAL_FRONTEND_URLS }}"
        S3BucketName=${{ secrets.S3_BUCKET_NAME }}
        S3PublicBaseUrl=${{ secrets.S3_PUBLIC_BASE_URL }}
        SesSenderEmail=${{ secrets.SES_SENDER_EMAIL }}
        PrivateSubnetIds=${{ secrets.PRIVATE_SUBNET_IDS }}
        LambdaSecurityGroupIds=${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}

    - name: Post-Deployment Health Check
      run: |
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name workforce-api-dev \
          --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
          --output text)
        
        echo "Testing API at: $API_URL/health"
        curl -f -s -o /dev/null -w "%{http_code}" $API_URL/health || (echo "Health check failed!" && exit 1)
        echo "Health check passed!"

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'uat' }}
    environment: uat
    concurrency:
      group: backend-uat-deployment
      cancel-in-progress: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Configure AWS credentials from OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Setup AWS SAM CLI
      uses: aws-actions/setup-sam@v2
      with:
        use-installer: true

    - name: Validate Secrets
      run: |
        if [ -z "${{ secrets.DATABASE_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.APPLICATION_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.DB_NAME }}" ] || \
           [ -z "${{ secrets.MICROSOFT_CLIENT_ID }}" ] || \
           [ -z "${{ secrets.MICROSOFT_TENANT_ID }}" ] || \
           [ -z "${{ secrets.REDIRECT_URI }}" ] || \
           [ -z "${{ secrets.FRONTEND_URL }}" ] || \
           [ -z "${{ secrets.S3_BUCKET_NAME }}" ] || \
           [ -z "${{ secrets.S3_PUBLIC_BASE_URL }}" ] || \
           [ -z "${{ secrets.SES_SENDER_EMAIL }}" ] || \
           [ -z "${{ secrets.PRIVATE_SUBNET_IDS }}" ] || \
           [ -z "${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}" ]; then
          echo "Error: One or more required secrets are missing. Deployment aborted."
          exit 1
        fi

    - name: SAM Build
      run: sam build --use-container

    - name: SAM Deploy
      run: >
        sam deploy 
        --stack-name workforce-api-uat 
        --resolve-s3 
        --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND 
        --no-confirm-changeset 
        --no-fail-on-empty-changeset 
        --parameter-overrides 
        EnvironmentName=uat 
        DatabaseSecretArn=${{ secrets.DATABASE_SECRET_ARN }} 
        ApplicationSecretArn=${{ secrets.APPLICATION_SECRET_ARN }} 
        DbName=${{ secrets.DB_NAME }} 
        MicrosoftClientId=${{ secrets.MICROSOFT_CLIENT_ID }} 
        MicrosoftTenantId=${{ secrets.MICROSOFT_TENANT_ID }} 
        RedirectUri=${{ secrets.REDIRECT_URI }}
        FrontendUrl=${{ secrets.FRONTEND_URL }}
        AdditionalFrontendUrls="${{ secrets.ADDITIONAL_FRONTEND_URLS }}"
        S3BucketName=${{ secrets.S3_BUCKET_NAME }}
        S3PublicBaseUrl=${{ secrets.S3_PUBLIC_BASE_URL }}
        SesSenderEmail=${{ secrets.SES_SENDER_EMAIL }}
        PrivateSubnetIds=${{ secrets.PRIVATE_SUBNET_IDS }}
        LambdaSecurityGroupIds=${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}

    - name: Post-Deployment Health Check
      run: |
        API_URL=$(aws cloudformation describe-stacks \
          --stack-name workforce-api-uat \
          --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
          --output text)
        
        echo "Testing API at: $API_URL/health"
        curl -f -s -o /dev/null -w "%{http_code}" $API_URL/health || (echo "Health check failed!" && exit 1)
        echo "Health check passed!"
