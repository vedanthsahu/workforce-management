        use-installer: true

    - name: Validate Secrets
      run: |
        if [ -z "${{ secrets.DATABASE_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.APPLICATION_SECRET_ARN }}" ] || \
           [ -z "${{ secrets.DB_NAME }}" ] || \
           [ -z "${{ secrets.MICROSOFT_CLIENT_ID }}" ] || \
           [ -z "${{ secrets.MICROSOFT_TENANT_ID }}" ] || \
           [ -z "${{ secrets.REDIRECT_URI }}" ] || \
           [ -z "${{ secrets.FRONTEND_URL }}" ] || \
           [ -z "${{ secrets.S3_BUCKET_NAME }}" ] || \
           [ -z "${{ secrets.S3_PUBLIC_BASE_URL }}" ] || \
           [ -z "${{ secrets.SES_SENDER_EMAIL }}" ] || \
           [ -z "${{ secrets.PRIVATE_SUBNET_IDS }}" ] || \
           [ -z "${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}" ]; then
          echo "Error: One or more required secrets are missing. Deployment aborted."
          exit 1
        fi

    - name: SAM Build
      run: sam build --use-container

    - name: Stage migration files to S3
      run: aws s3 sync backend/db/migrations/ s3://${{ secrets.S3_BUCKET_NAME }}/ci-migrations/uat/ --delete

    - name: Run database migrations (uat)
      run: |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ vars.MIGRATION_BASTION_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "backend-cd: uat migrations for ${{ github.sha }}" \
          --parameters commands="[
            \"aws s3 sync s3://${{ secrets.S3_BUCKET_NAME }}/ci-migrations/uat/ /opt/seatbook-migrations-uat/ --delete\",
            \"chmod +x /opt/seatbook-migrations-uat/ci_run_migrations.sh\",
            \"MIGRATE_TARGET=uat MIGRATOR_SECRET_ARN='${{ secrets.UAT_MIGRATOR_SECRET_ARN }}' DB_HOST_REAL='${{ secrets.RDS_ENDPOINT }}' WORKDIR=/opt/seatbook-migrations-uat /opt/seatbook-migrations-uat/ci_run_migrations.sh\"
          ]" \
          --query "Command.CommandId" --output text)

        echo "SSM command: $COMMAND_ID"
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.MIGRATION_BASTION_INSTANCE_ID }}" || true

        STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.MIGRATION_BASTION_INSTANCE_ID }}" --query "Status" --output text)
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.MIGRATION_BASTION_INSTANCE_ID }}" --query "StandardOutputContent" --output text
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.MIGRATION_BASTION_INSTANCE_ID }}" --query "StandardErrorContent" --output text

        if [ "$STATUS" != "Success" ]; then
          echo "Migration failed on bastion (status: $STATUS). Aborting before deploy."
          exit 1
        fi

    - name: SAM Deploy
      run: >
        sam deploy
        --stack-name workforce-api-uat
        --resolve-s3 
        --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND 
        --no-confirm-changeset 
        --no-fail-on-empty-changeset 
        --parameter-overrides 
        EnvironmentName=uat 
        DatabaseSecretArn=${{ secrets.DATABASE_SECRET_ARN }} 
        ApplicationSecretArn=${{ secrets.APPLICATION_SECRET_ARN }} 
        DbName=${{ secrets.DB_NAME }} 
        MicrosoftClientId=${{ secrets.MICROSOFT_CLIENT_ID }} 
        MicrosoftTenantId=${{ secrets.MICROSOFT_TENANT_ID }} 
        RedirectUri=${{ secrets.REDIRECT_URI }}
        FrontendUrl=${{ secrets.FRONTEND_URL }}
        AdditionalFrontendUrls="${{ secrets.ADDITIONAL_FRONTEND_URLS }}"
        S3BucketName=${{ secrets.S3_BUCKET_NAME }}
        S3PublicBaseUrl=${{ secrets.S3_PUBLIC_BASE_URL }}
        SesSenderEmail=${{ secrets.SES_SENDER_EMAIL }}
        PrivateSubnetIds=${{ secrets.PRIVATE_SUBNET_IDS }}
        LambdaSecurityGroupIds=${{ secrets.LAMBDA_SECURITY_GROUP_IDS }}

    - name: Post-Deployment Health Check
      run: |
        API_URL=$(aws cloudformation describe-stacks \
