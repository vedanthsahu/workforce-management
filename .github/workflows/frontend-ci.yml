name: Frontend CI

on:
  pull_request:
    branches: [ "dev" ]
    paths:
      - 'frontend/**'
  push:
    branches:
      - '**'
    paths:
      - 'frontend/**'
  workflow_dispatch: # <-- Add this at the same indentation level as push/pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Run TypeScript Check
      run: npx tsc --noEmit

    - name: Build Next.js app
      run: npm run build
